name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252，脚本里的中文输出会直接崩
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 前端产物被 go:embed 引用，必须先于 go 编译生成
      - name: Frontend install & build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      # 内嵌的第三方二进制不进版本库；用空占位文件让 go:embed 能编过。
      # 单测只覆盖纯逻辑，不需要真实内核。
      - name: Placeholder assets
        run: python scripts/fetch-assets.py --placeholders

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...
